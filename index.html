<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Bug Idler</title>
        <meta charset="UTF-8">
        <meta name="description" content="A game about bugs eating leaves. All of the leaves.">
        <meta name="keywords" content="bug, bugs, idle, game, idler, chill">
        <meta name="author" content="professionaljpeg">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="public/style.css">
    </head>
    
    <body>
        <div id="wrapper">
            <div id="game">
                <canvas id="backgroundCanvas" style="background: transparent;"></canvas>
                    <div id="sectionLeft" class="inset">
                        <canvas id="backgroundLeftCanvas" style="z-index:5;" width="461" height="262"></canvas>
                        <div id="shop-title-box" class="insetTitle">
                            <h3 class="title">Shop</h3>
                        </div>

                        <div id="ant-shop" class="shop-box">
                            
                        </div>

                        <div id="fly-shop" class="shop-box">

                        </div>

                        <div id="bee-shop" class="shop-box">

                        </div>

                        <div id="butterfly-shop" class="shop-box">

                        </div>

                        <div id="mantis-shop" class="shop-box">

                        </div>
                    </div>

                    <div id="sectionMiddle" class="inset">
                        <div id="menuBar">
                            <div id="title-box" style="align-self: center;">
                                <h1>Bug Idler</h1>
                            </div>
                            <div id="leafButton" class="panelButton">
                                <h3>Leaf</h3>
                            </div>
                            <div id="htpButton" class="panelButton">
                                <h3>How to Play</h3>
                            </div>
                            <div id="stats-nav-box" class="panelButton">
                                <h3>Stats</h3>
                            </div>
                            <div id="settings-nav-box" class="panelButton">
                                <h3>Setttings</h3>
                            </div>
                        </div>
                        
                        <div id="leaf-counter-box" class="leaf-panel-box">
                            <h3 class="title"><div id="counter">0</div> leaves</h3>
                        </div>

                        <div id="leaf-box">
                            <img
                                src="assets/Bug_Idler_Dew_Leaf.png"
                                alt="A big leaf"
                            >
                        </div>
                    </div>
                
                    <div id="sectionRight" class="inset">
                        <div id="upgrades-title-box" class="panel-title">
                            <h3 class="title">Bugs</h3>
                        </div>

                        <div id="ant-box" class="bug-box">

                        </div>

                        <div id="fly-box" class="bug-box">

                        </div>

                        <div id="bee-box" class="bug-box">

                        </div>

                        <div id="butterfly-box" class="bug-box">

                        </div>

                        <div id="mantis-box" class="bug-box">

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
